name: README

on:
  push:
    branches: [main]
  schedule:
    - cron: "10 3 * * *" # 00h10 em Brasília, para a sequência de dias não ficar velha
  workflow_dispatch:

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: é dele que saem as datas e o heatmap

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python3 scripts/atualizar_readme.py

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .github/README.md .github/assets
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "📊 atualiza estatísticas"
            git pull --rebase --autostash
            git push
          fi
